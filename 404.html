<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akuma Max</title>
<link rel="icon" href="./icon.svg">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0b0b0c;color:#e6e6e6;
       font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:#7aa2f7}
</style>
</head>
<body>
<div>
  <p>正在打开 Akuma Max…</p>
  <p><a href="./">如果没有自动跳转，点这里</a></p>
</div>
<script>
// 从当前路径推导 base：去掉最后一段（404.html 本身），得到部署根。
// 例：/AKUMA-MAX/404.html → /AKUMA-MAX/
//     /AKUMA-MAX/library → /AKUMA-MAX/
//     /AKUMA-MAX/demo/x  → /AKUMA-MAX/demo/
(function () {
  var p = location.pathname;
  var isDemo = /\/demo(\/|$)/.test(p);
  // 去掉文件名，再去掉 demo 这一层（demo 要保留）
  var dir = p.replace(/[^/]*$/, "");
  if (isDemo && !/\/demo\/$/.test(dir)) dir += "demo/";
  var rest = p.replace(dir, "").replace(/^\/+/, "");
  location.replace(dir + "#/" + rest);
})();
</script>
</body>
</html>
