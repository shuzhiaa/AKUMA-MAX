<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Akuma Max · 英语学习辅助工具</title>
    <script>
      // 本站使用 hash 路由（#/library）。GitHub Pages 对不存在的路径返回本文件，
      // 这里把 /AKUMA-MAX/library 这类深层路径转成 /AKUMA-MAX/#/library。
      // 不能直接把应用外壳放在这里：深层路径下 ./assets/ 会被解析成 /AKUMA-MAX/library/assets/，整页白屏。
      (function () {
        var seg = location.pathname.split("/").filter(Boolean);
        var base = "/";
        // GitHub Pages 项目站点的第一段是仓库名；部署在站点根目录时没有这一段
        if (seg.length && (/\.github\.io$/i.test(location.hostname) || /^akuma-max$/i.test(seg[0]))) {
          base += seg.shift() + "/";
        }
        if (seg[0] === "demo") {
          base += seg.shift() + "/";
        }
        var rest = seg.join("/");
        location.replace(base + location.search + (location.hash || (rest ? "#/" + rest : "")));
      })();
    </script>
  </head>
  <body>
    <noscript>页面不存在。Akuma Max 需要启用 JavaScript。</noscript>
  </body>
</html>
